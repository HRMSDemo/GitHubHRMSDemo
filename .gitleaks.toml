title = "HRMS Enterprise Secret Detection Policy"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password"
description = "Hardcoded password assignment"
regex = '''(?i)(password|passwd|pwd)[ \t]*[:=][ \t]*["']?[^"' \t\r\n;]{4,}'''
tags = ["credential", "password"]

[[rules]]
id = "database-password"
description = "Database password assignment"
regex = '''(?i)(db_password|database_password|sql_password|mysql_password|postgres_password)[ \t]*[:=][ \t]*["']?[^"' \t\r\n;]{4,}'''
tags = ["database", "credential"]

[[rules]]
id = "client-secret"
description = "Client/application secret"
regex = '''(?i)(client_secret|clientsecret|app_secret|application_secret)[ \t]*[:=][ \t]*["']?[^"' \t\r\n;]{4,}'''
tags = ["oauth", "credential"]

[[rules]]
id = "api-secret"
description = "API key or token assignment"
regex = '''(?i)(api_secret|apisecret|api_key|apikey|access_token|auth_token)[ \t]*[:=][ \t]*["']?[^"' \t\r\n;]{6,}'''
tags = ["api", "token"]

[[rules]]
id = "connection-string-password"
description = "Password embedded in connection string"
regex = '''(?i)(password|pwd)[ \t]*=[ \t]*[^;\r\n]{4,}'''
tags = ["database", "connection-string"]

[[rules]]
id = "sql-user-id"
description = "SQL connection string user ID"
regex = '''(?i)(user[ \t]*id|uid)[ \t]*=[ \t]*[^;\r\n]{2,}'''
tags = ["database", "username"]

[[rules]]
id = "db-username"
description = "Database username assignment"
regex = '''(?i)(db_user|db_username|database_user|database_username|sql_user|sql_username)[ \t]*[:=][ \t]*["']?[^"' \t\r\n;]{2,}'''
tags = ["database", "username"]

[[rules]]
id = "private-key"
description = "Private key material"
regex = '''-----BEGIN[ \t]+(RSA[ \t]+|EC[ \t]+|OPENSSH[ \t]+)?PRIVATE[ \t]+KEY-----'''
tags = ["private-key"]

[[rules]]
id = "jwt-token"
description = "JWT token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt", "token"]

[[rules]]
id = "bearer-token"
description = "Bearer token"
regex = '''(?i)bearer[ \t]+[A-Za-z0-9._~+/-]{12,}'''
tags = ["token"]

[[rules]]
id = "basic-auth-url"
description = "URL containing embedded username/password"
regex = '''https?://[^/: \t\r\n]+:[^@/ \t\r\n]+@[^ \t\r\n]+'''
tags = ["credential", "url"]

[[rules]]
id = "generic-secret"
description = "Generic secret or credential assignment"
regex = '''(?i)(secret|token|credential)[ \t]*[:=][ \t]*["']?[A-Za-z0-9_./+=:@!-]{8,}'''
tags = ["credential"]

[[rules]]
id = "private-ip"
description = "Internal/private IPv4 address"
regex = '''(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})'''
tags = ["infrastructure", "internal-ip"]

[[rules]]
id = "database-host"
description = "Hardcoded database/server host"
regex = '''(?i)(db_host|database_host|sql_host|server)[ \t]*[:=][ \t]*["']?[A-Za-z0-9._:-]+'''
tags = ["database", "host"]

[[rules]]
id = "sql-create-login-password"
description = "SQL CREATE LOGIN/USER statement containing password"
regex = '''(?i)(create[ \t]+login|create[ \t]+user)[^\r\n]{0,120}(password|identified[ \t]+by)'''
tags = ["sql", "credential"]